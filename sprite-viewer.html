<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Frame viewer — player_agent (1..56)</title>
  <style>
    body { margin: 12px; background: #111; color: #eee; font-family: monospace; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
    .cell { background: #1a1a1a; border: 1px solid #333; padding: 6px; text-align: center; }
    .cell img { image-rendering: pixelated; max-width: 70px; }
    .num { font-weight: bold; }
  </style>
</head>
<body>
  <h1>player_agent frames 1–56</h1>
  <p>Usá estos números en <code>window.PLAYER_SPRITE_MAP</code> (ej. <code>{ idle: sfRange(1,4), walk: [5,6,7] }</code>).</p>
  <div class="grid" id="g"></div>
  <script>
    const g = document.getElementById('g');
    for (let n = 1; n <= 56; n++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      const img = document.createElement('img');
      img.src = `superfighters/sprites/DefineSprite_1245_player_agent/${n}.png`;
      const num = document.createElement('div');
      num.className = 'num';
      num.textContent = n;
      cell.appendChild(img);
      cell.appendChild(num);
      g.appendChild(cell);
    }
  </script>
</body>
</html>
